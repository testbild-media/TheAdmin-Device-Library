name: Build ADLIB release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate and package library
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/build_release.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: theadmin-device-library
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Attach ADLIB to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.archive }}" --clobber
